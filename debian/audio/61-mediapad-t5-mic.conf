monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.platform-hifi-test.*" }
      { media.class = "Audio/Source" api.alsa.path = "~.*hw:T5HiFi,0" }
    ]
    actions = {
      update-props = {
        node.description = "MediaPad T5 内置麦克风"
        api.alsa.period-size = 960
        api.alsa.period-num = 12
        api.alsa.disable-batch = true
        api.alsa.disable-tsched = true
        audio.format = "S16LE"
        audio.channels = 2
        audio.position = [ FL FR ]
        audio.rate = 48000
        audio.allowed-rates = [ 48000 ]
        node.force-quantum = 960
        session.suspend-timeout-seconds = 3
      }
    }
  }
]
