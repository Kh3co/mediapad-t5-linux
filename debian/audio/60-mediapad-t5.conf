monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.platform-hifi-test.*" }
      { api.alsa.card.id = "T5HiFi" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = true
        api.alsa.use-ucm = true
        api.alsa.soft-mixer = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.platform-hifi-test.*" }
      { media.class = "Audio/Sink" api.alsa.path = "~.*hw:T5HiFi,0" }
    ]
    actions = {
      update-props = {
        node.description = "MediaPad T5 内置扬声器"
        api.alsa.period-size = 960
        api.alsa.period-num = 2
        api.alsa.disable-batch = true
        api.alsa.disable-tsched = true
        audio.format = "S16LE"
        audio.channels = 2
        audio.position = [ FL FR ]
        audio.rate = 48000
        audio.allowed-rates = [ 48000 ]
        node.force-quantum = 960
        session.suspend-timeout-seconds = 3
      }
    }
  }
]
